spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
server:
  address: 127.0.0.1
  tomcat:
    basedir: ${BYTE_JUDGE_RUNTIME_DIR:./.local/runtime}/judge
    accesslog:
      enabled: true
      directory: ${BYTE_JUDGE_LOG_DIR:${user.dir}/log}/judge/access
      prefix: access
      suffix: .log
      pattern: '%t %m %U %s'
