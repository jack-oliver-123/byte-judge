byte-judge:
  internal:
    # Same controlled service identity as the user service expects for the gateway.
    gateway-credential: ${BYTE_JUDGE_INTERNAL_GATEWAY_CREDENTIAL}
spring:
  application:
    name: byte-judge-gateway
  profiles:
    default: local
  config:
    # Required values are validated in WebProtocolConfiguration because this client may return
    # an empty source for a missing Data ID. A valid local snapshot can satisfy the import.
    # Credentials and connection endpoints stay in the controlled environment/file.
    import:
      - "classpath:byte-judge-session.yml"
      # The group comes from spring.cloud.nacos.config.group below; the location itself keeps
      # no environment-specific placeholder so the Data ID stays stable across environments.
      - "nacos:byte-judge-common.yml?refreshEnabled=false"
      - "nacos:byte-judge-gateway.yml?refreshEnabled=false"
  mvc:
    # The gateway only proxies. Publishing request-handled events makes DispatcherServlet call
    # getSession(false), which would make this process load and re-save a session owned by the
    # user service; a save racing with the owner's delete leaves a partial Redis hash.
    publish-request-handled-events: false
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user
              uri: lb://byte-judge-user-model
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/me/messages/**,/api/v1/admin/users/**
            - id: problem
              uri: lb://byte-judge-problem-model
              predicates:
                - Path=/api/v1/problems/**,/api/v1/admin/problems/**
            - id: submission
              uri: lb://byte-judge-submission-model
              predicates:
                - Path=/api/v1/submissions/**,/api/v1/runs/**,/api/v1/me/statistics/**,/api/v1/admin/submissions/**,/api/v1/admin/executions/**,/api/v1/admin/schedules/**
            - id: contest
              uri: lb://byte-judge-contest-model
              predicates:
                - Path=/api/v1/contests/**,/api/v1/me/contests/**,/api/v1/admin/contests/**
    nacos:
      # Config connection settings only. The imported documents contain no credentials.
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:BYTE_JUDGE}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_DISCOVERY_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:BYTE_JUDGE}
        ip: ${SERVICE_IP:127.0.0.1}
server:
  port: ${SERVER_PORT:8080}
logging:
  file:
    name: ${BYTE_JUDGE_LOG_DIR:${user.dir}/log}/gateway/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
